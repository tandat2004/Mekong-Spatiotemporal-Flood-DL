name: mekong-flood
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - gdal=3.13
  - rasterio=1.5
  - geopandas
  - pyproj
  - numpy>=2,<3
  - pandas
  - matplotlib
  - scikit-learn
  - xgboost
  - pytorch=2.14.*=cpu*
  - torchvision=0.29.*=cpu*
  - earthengine-api
  - geemap=0.38
  - jupyter